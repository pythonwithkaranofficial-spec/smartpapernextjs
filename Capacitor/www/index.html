<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Smart Paper Generator AI</title>
  <style>
    :root {
      --bg-color: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #06b6d4 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }
    /* Ambient glowing background blobs */
    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      top: -10%;
      left: -10%;
      width: 280px;
      height: 280px;
      background: rgba(59, 130, 246, 0.25);
    }
    .blob-2 {
      bottom: -10%;
      right: -10%;
      width: 260px;
      height: 260px;
      background: rgba(139, 92, 246, 0.25);
    }
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .logo-badge {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px;
      border-radius: 22px;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      animation: pulse 3s infinite ease-in-out;
    }
    .logo-badge svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    h1 span {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 16px auto;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
    /* Offline Card State */
    .offline-box {
      display: none;
      margin-top: 12px;
    }
    .retry-btn {
      margin-top: 20px;
      width: 100%;
      padding: 14px 20px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: var(--primary-gradient);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
      transition: transform 0.2s, opacity 0.2s;
    }
    .retry-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>
<body>
  <div class="glow-blob blob-1"></div>
  <div class="glow-blob blob-2"></div>

  <div class="container">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
        <path d="M2 17l10 5 10-5"></path>
        <path d="M2 12l10 5 10-5"></path>
      </svg>
    </div>
    <h1>Smart Paper <span>AI</span></h1>
    <p class="subtitle">Creating CBSE Question Papers in Seconds with Artificial Intelligence</p>

    <div id="loader-section">
      <div class="spinner"></div>
      <div class="status-text" id="status-label">Connecting securely to Smart Paper AI...</div>
    </div>

    <div class="offline-box" id="offline-section">
      <p style="color: #f87171; font-size: 13px; font-weight: 600; margin-bottom: 8px;">
        ⚠️ No Internet Connection
      </p>
      <p style="font-size: 12px; color: var(--text-muted);">
        Please check your Wi-Fi or mobile data to generate and manage question papers.
      </p>
      <button class="retry-btn" onclick="retryConnection()">Retry Connection</button>
    </div>
  </div>

  <script src="native-bridge.js"></script>
  <script>
    const TARGET_URL = "https://paperbykaran.vercel.app";

    function checkConnectionAndRedirect() {
      if (navigator.onLine) {
        document.getElementById('status-label').innerText = "Launching application...";
        // If loaded in Capacitor webview and online, redirect seamlessly
        window.location.replace(TARGET_URL);
      } else {
        document.getElementById('loader-section').style.display = 'none';
        document.getElementById('offline-section').style.display = 'block';
      }
    }

    function retryConnection() {
      document.getElementById('offline-section').style.display = 'none';
      document.getElementById('loader-section').style.display = 'block';
      document.getElementById('status-label').innerText = "Reconnecting...";
      setTimeout(checkConnectionAndRedirect, 1200);
    }

    window.addEventListener('online', checkConnectionAndRedirect);
    window.addEventListener('load', () => {
      setTimeout(checkConnectionAndRedirect, 800);
    });
  </script>
</body>
</html>
